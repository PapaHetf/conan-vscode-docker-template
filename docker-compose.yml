version: '3.8'

services:
  conan-builder:
    build: .
    volumes:
      - .:/workspace
      - conan-cache:/root/.conan2
    working_dir: /workspace
    environment:
      - CONAN_USER_HOME=/root/.conan2
      - PROJECT_NAME=${PROJECT_NAME:-my_app}
      - PROJECT_VERSION_MAJOR=${PROJECT_VERSION_MAJOR:-0}
      - PROJECT_VERSION_MINOR=${PROJECT_VERSION_MINOR:-1}
      - PROJECT_VERSION_PATCH=${PROJECT_VERSION_PATCH:-0}
    command: /bin/bash

volumes:
  conan-cache:
